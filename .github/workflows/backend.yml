name: Deploy Backend to AWS EC2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: Build backend
        working-directory: backend
        run: npm run build --if-present

      # SSH setup (FIXED – no empty key)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Debug: Verify key format
          echo "SSH Key setup complete"
          ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null || echo "Warning: Could not verify key format"

      - name: Deploy backend to EC2
        run: |
          # Ensure app directory exists
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ secrets.EC2_APP_PATH }}"
          
          rsync -avz \
            --exclude node_modules \
            --exclude .git \
            --exclude logs \
            --exclude .ssh \
            --exclude .pm2 \
            --exclude .cache \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_PATH }}/

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ secrets.EC2_APP_PATH }} && npm ci --omit=dev && pm2 restart all || pm2 start src/app.js --name backend"

      - name: Deployment status
        if: always()
        run: echo "Backend deployment status - Success"
